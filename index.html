<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Çok Hangi Meyve Var?</title>
    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ses Efektleri için Tone.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap');

        body {
            font-family: 'Baloo 2', cursive;
            margin: 0;
            overflow: hidden; /* Ekranın dışına taşan animasyonları gizle */
            user-select: none; /* Metin seçimini engelle */
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF); /* Gökyüzü */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canlı Orman / Bahçe Arka Plan CSS Çizimi */
        .background-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: -1;
        }
        
        .grass-back {
            background-color: #55a630;
            height: 30vh;
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
            transform: scale(1.2);
            position: absolute;
            bottom: -5vh;
            width: 100%;
        }

        .grass-front {
            background-color: #80b918;
            height: 25vh;
            border-radius: 50% 50% 0 0 / 40px 40px 0 0;
            position: absolute;
            bottom: -2vh;
            width: 110%;
            left: -5%;
        }
        
        .cloud {
            background: white;
            border-radius: 50px;
            position: absolute;
            opacity: 0.8;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-20vw); }
        }

        /* UI Eleman Stilleri */
        .game-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 5px solid #FFD166;
            padding: 2rem;
            text-align: center;
            max-width: 800px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .btn-primary {
            background: linear-gradient(to bottom, #06D6A0, #04aa7d);
            color: white;
            padding: 15px 40px;
            font-size: 2rem;
            border-radius: 50px;
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #038a65, 0 15px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-primary:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #038a65, 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Geri Sayım Animasyonu */
        .countdown-text {
            font-size: 8rem;
            color: #FF5A5F;
            text-shadow: 4px 4px 0 #FFF, 8px 8px 0 #333;
            animation: popIn 1s infinite ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Oyun Alanı */
        #gameArea {
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            margin: 10px auto;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 20px;
            border: 3px dashed #EF476F;
            width: 100%;
            max-width: 50vh; /* Ekranın dikeyine sığması için */
            aspect-ratio: 1 / 1; /* Kusursuz kare */
        }

        .fruit-item {
            width: 100%;
            height: 100%;
            max-height: 100%;
            cursor: pointer;
            object-fit: contain;
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            animation: appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fruit-item:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .fruit-item:active {
            transform: scale(0.9);
        }

        @keyframes appear {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Doğru/Yanlış Efektleri */
        .correct-choice {
            animation: bounce 0.5s ease;
        }
        
        .wrong-choice {
            animation: shake 0.5s ease;
            filter: grayscale(100%);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px) scale(1.1);}
            60% {transform: translateY(-15px);}
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        /* Üst Bilgi Çubuğu */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #118AB2;
        }
        
        .score-box, .time-box {
            background: #FFF;
            padding: 10px 20px;
            border-radius: 20px;
            border: 3px solid #118AB2;
            box-shadow: 0 4px 0 #118AB2;
        }

        .time-warning {
            color: #EF476F;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* Fallback stili (Eğer resim yüklenmezse diye) */
        .fruit-placeholder {
            width: 80px;
            height: 80px;
            background-color: #ffd166;
            border-radius: 50%;
            display: inline-block;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }

        .star-image {
            max-width: 200px;
            margin: 0 auto 20px;
            animation: spinAndPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spinAndPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- Arka Plan Süslemeleri -->
    <div class="cloud" style="width: 100px; height: 30px; top: 10%; animation-duration: 25s; animation-delay: 0s;"></div>
    <div class="cloud" style="width: 150px; height: 50px; top: 20%; animation-duration: 35s; animation-delay: -10s;"></div>
    <div class="cloud" style="width: 80px; height: 25px; top: 15%; animation-duration: 18s; animation-delay: -5s;"></div>
    
    <div class="background-layer">
        <div class="grass-back"></div>
        <div class="grass-front"></div>
    </div>

    <!-- 1. ANA EKRAN -->
    <div id="screen-start" class="game-panel">
        <h1 class="text-5xl text-[#EF476F] mb-4 drop-shadow-md">Meyve Avcısı!</h1>
        <p class="text-xl text-gray-700 mb-8">Ekranda en çok hangi meyveden varsa onu bul ve tıkla!<br>Hindistan cevizini kaçırma!</p>
        
        <button id="btnStart" class="btn-primary">Oyuna Başla</button>
        
        <div class="mt-8 flex justify-center space-x-4 opacity-70">
            <!-- Örnek Dekoratif Meyveler -->
            <img src="images/hindistancevizi.png" onerror="this.src='https://placehold.co/60x60/8B4513/FFF?text=HC'" class="w-16 h-16 animate-bounce" style="animation-delay: 0.1s">
            <img src="images/elma.png" onerror="this.src='https://placehold.co/60x60/FF0000/FFF?text=E'" class="w-16 h-16 animate-bounce" style="animation-delay: 0.3s">
            <img src="images/muz.png" onerror="this.src='https://placehold.co/60x60/FFD700/FFF?text=M'" class="w-16 h-16 animate-bounce" style="animation-delay: 0.5s">
        </div>
    </div>

    <!-- 2. GERİ SAYIM EKRANI -->
    <div id="screen-countdown" class="hidden absolute inset-0 flex items-center justify-center z-50">
        <div id="countdown-number" class="countdown-text">5</div>
    </div>

    <!-- 3. OYUN EKRANI -->
    <div id="screen-game" class="hidden game-panel">
        <div class="top-bar">
            <div class="score-box">
                Puan: <span id="scoreDisplay" class="text-[#06D6A0] font-bold">0</span>
            </div>
            <div class="time-box" id="timeBox">
                Süre: <span id="timeDisplay">180</span>s
            </div>
        </div>
        
        <h2 class="text-3xl text-[#118AB2] mb-2 drop-shadow-sm">En Fazla Olanı Seç!</h2>
        
        <div id="gameArea">
            <!-- Meyveler buraya JavaScript ile eklenecek -->
        </div>
    </div>

    <!-- 4. BİTİŞ EKRANI -->
    <div id="screen-end" class="hidden game-panel">
        <h2 class="text-5xl text-[#EF476F] mb-6">Süre Bitti!</h2>
        
        <!-- Yıldız Görseli (Kullanıcının yükleyeceği) -->
        <img src="images/yildiz.png" onerror="this.src='https://placehold.co/150x150/FFD700/FFF?text=YILDIZ'" alt="Başarı Yıldızı" class="star-image">
        
        <p class="text-3xl text-gray-700 mb-8">Topladığın Puan: <span id="finalScore" class="text-5xl text-[#06D6A0]">0</span></p>
        
        <button id="btnRestart" class="btn-primary">Tekrar Oyna</button>
    </div>

    <!-- 5. YANLIŞ CEVAP EKRANI (MODAL) -->
    <div id="screen-wrong" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm">
        <div class="game-panel border-red-500 border-8 transform transition-transform scale-100 flex flex-col items-center">
            <h2 class="text-6xl text-[#EF476F] mb-4 drop-shadow-md">Ups! Yanlış Seçim 🙈</h2>
            <p class="text-3xl text-gray-700 mb-6 font-bold">Daha dikkatli bakmalısın!<br>Hadi farklı bir tabloyla tekrar dene.</p>
            <div class="text-8xl mb-4 animate-bounce">❌</div>
        </div>
    </div>

    <script>
        // --- DEĞİŞKENLER ---
        const GAME_DURATION = 180; // Saniye cinsinden
        let score = 0;
        let timeLeft = GAME_DURATION;
        let timerInterval;
        let countdownInterval;
        
        // Kullanıcının klasöre koyması gereken resim isimleri (images/ klasörü eklendi)
        const fruitImages = [
            "images/hindistancevizi.png",
            "images/elma.png", 
            "images/muz.png", 
            "images/cilek.png", 
            "images/portakal.png", 
            "images/kivi.png", 
            "images/karpuz.png", 
            "images/uzum.png", 
            "images/kiraz.png", 
            "images/armut.png"
        ];

        let currentTargetFruit = ""; // Bu turda en çok olan meyve
        let isInputLocked = false; // Tıklama spamini önlemek için

        // --- SES DEĞİŞKENLERİ VE KURULUMU ---
        let audioInitialized = false;
        let tickSynth, correctSynth, wrongSynth;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start(); // Tarayıcı güvenlik politikasını aşmak için kullanıcı etkileşimiyle başlat
            
            // 1. Geri Sayım Sesi (Kısa ve hafif bir bip)
            tickSynth = new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            tickSynth.volume.value = -10; // Sesi biraz kıs

            // 2. Doğru Cevap Sesi (Neşeli ve kısa çan/melodi)
            correctSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 }
            }).toDestination();
            correctSynth.volume.value = -5;

            // 3. Yanlış Cevap Sesi (Kısa, tok bir hata/bızz sesi)
            wrongSynth = new Tone.Synth({
                oscillator: { type: 'sawtooth' },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
            }).toDestination();
            wrongSynth.volume.value = -12; // Sesi rahatsız etmeyecek kadar kıs

            audioInitialized = true;
        }

        function playTick(isHigh = false) {
            if (!audioInitialized) return;
            // Başla yazısında (isHigh) bir oktav ince çalar
            tickSynth.triggerAttackRelease(isHigh ? "C6" : "C5", "32n");
        }

        function playCorrect() {
            if (!audioInitialized) return;
            // Kısa, neşeli iki nota (C5 ve E5)
            const now = Tone.now();
            correctSynth.triggerAttackRelease(["C5", "E5"], "16n", now);
        }

        function playWrong() {
            if (!audioInitialized) return;
            // Kısa, kalın bir hata notası
            wrongSynth.triggerAttackRelease("C3", "8n");
        }

        // --- DOM ELEMANLARI ---
        const screenStart = document.getElementById('screen-start');
        const screenCountdown = document.getElementById('screen-countdown');
        const screenGame = document.getElementById('screen-game');
        const screenEnd = document.getElementById('screen-end');
        const screenWrong = document.getElementById('screen-wrong');
        
        const btnStart = document.getElementById('btnStart');
        const btnRestart = document.getElementById('btnRestart');
        const countdownNumber = document.getElementById('countdown-number');
        
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const timeBox = document.getElementById('timeBox');
        const gameArea = document.getElementById('gameArea');
        const finalScore = document.getElementById('finalScore');

        // --- OLAY DİNLEYİCİLERİ ---
        btnStart.addEventListener('click', async () => {
            await initAudio(); // Sesi başlat (tarayıcı izni)
            startCountdown();
        });
        btnRestart.addEventListener('click', resetGameToStart);

        // --- FONKSİYONLAR ---

        function startCountdown() {
            screenStart.classList.add('hidden');
            screenCountdown.classList.remove('hidden');
            
            let count = 5;
            // İlk sayıyı hemen göster
            countdownNumber.innerText = count;
            countdownNumber.style.color = getRandomColor();
            playTick(); // Tıklama sesi çal

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    // Animasyonu yeniden tetiklemek için
                    countdownNumber.innerText = count;
                    countdownNumber.style.color = getRandomColor();
                    playTick(); // Tıklama sesi çal
                    
                    countdownNumber.classList.remove('countdown-text');
                    void countdownNumber.offsetWidth; // Reflow tetikle
                    countdownNumber.classList.add('countdown-text');
                    
                } else if (count === 0) {
                    countdownNumber.innerText = "BAŞLA!";
                    countdownNumber.style.color = "#06D6A0";
                    playTick(true); // Yüksek tiz ses (başlama sesi)
                } else {
                    clearInterval(countdownInterval);
                    startGame();
                }
            }, 1000);
        }

        function getRandomColor() {
            const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#073B4C', '#9D4EDD'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function startGame() {
            screenCountdown.classList.add('hidden');
            screenGame.classList.remove('hidden');
            
            score = 0;
            timeLeft = GAME_DURATION;
            updateScoreDisplay();
            updateTimeDisplay();
            timeBox.classList.remove('time-warning');
            
            generateNewRound();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimeDisplay();
                
                if (timeLeft <= 10) {
                    timeBox.classList.add('time-warning');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            screenGame.classList.add('hidden');
            screenEnd.classList.remove('hidden');
            finalScore.innerText = score;
        }

        function resetGameToStart() {
            screenEnd.classList.add('hidden');
            screenStart.classList.remove('hidden');
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = score;
        }

        function updateTimeDisplay() {
            timeDisplay.innerText = timeLeft;
        }

        function generateNewRound() {
            gameArea.innerHTML = ''; // Önceki meyveleri temizle
            isInputLocked = false;
            
            const GRID_SIZE = 6;
            const TOTAL_SLOTS = GRID_SIZE * GRID_SIZE; // 36 kare
            
            // Kullanılacak meyveleri karıştır
            let shuffledFruits = [...fruitImages].sort(() => 0.5 - Math.random());
            
            // 1. Hedef Meyveyi Seç (En fazla olacak meyve)
            currentTargetFruit = shuffledFruits[0];
            let targetCount = Math.floor(Math.random() * 3) + 10; // 10 ile 12 adet arası
            
            let allFruitsToRender = [];
            
            // Hedef meyveleri listeye ekle
            for(let i=0; i<targetCount; i++) {
                allFruitsToRender.push({ type: currentTargetFruit, isTarget: true });
            }
            
            let slotsLeft = TOTAL_SLOTS - targetCount;
            const coconutPath = "images/hindistancevizi.png";

            // 2. Hindistan Cevizi Kontrolü (Öğrencinin favorisi her el olmalı 1-2 adet)
            if (currentTargetFruit !== coconutPath) {
                let coconutCount = Math.floor(Math.random() * 2) + 1; // 1 veya 2 adet
                for(let i=0; i<coconutCount; i++) {
                    allFruitsToRender.push({ type: coconutPath, isTarget: false });
                }
                slotsLeft -= coconutCount;
                // Diğer doldurmalarda tekrar çıkmaması için hindistan cevizini çıkar
                shuffledFruits = shuffledFruits.filter(f => f !== coconutPath);
            }

            // 3. Kalan Boşlukları Diğer Meyvelerle Doldur
            // Hedef meyveyi yedek havuzundan çıkaralım ki tekrar seçilmesin
            shuffledFruits = shuffledFruits.filter(f => f !== currentTargetFruit);
            
            // 4 farklı rastgele meyve daha seçelim
            let numDistractors = 4;
            let distractorTypes = shuffledFruits.slice(0, numDistractors);
            
            for (let i = 0; i < distractorTypes.length; i++) {
                let countToAdd;
                if (i === distractorTypes.length - 1) {
                    // Son meyveye tüm kalan slotları ver
                    countToAdd = slotsLeft; 
                } else {
                    // Kalan slotlara eşit olarak dağıtmaya çalış
                    let avg = Math.floor(slotsLeft / (distractorTypes.length - i));
                    countToAdd = avg + Math.floor(Math.random() * 3) - 1; // Ortalama civarı rastgelelik
                    // Güvenlik kontrolü: Hiçbir meyve hedef meyveyi geçmemeli ve sayı 1'den küçük olmamalı
                    countToAdd = Math.max(1, Math.min(countToAdd, targetCount - 1));
                }
                
                for(let j=0; j<countToAdd; j++) {
                    allFruitsToRender.push({ type: distractorTypes[i], isTarget: false });
                }
                slotsLeft -= countToAdd;
            }

            // Oluşturulan 49 meyveyi rastgele karıştır
            allFruitsToRender = allFruitsToRender.sort(() => 0.5 - Math.random());

            // DOM'a (Ekrana) ekle
            allFruitsToRender.forEach((fruitData, index) => {
                const img = document.createElement('img');
                img.src = fruitData.type;
                
                // Resim yoksa yer tutucu (placehold.co) kullan (başındaki images/ kısmını kırpıyoruz)
                const fallbackText = fruitData.type.replace('images/', '').substring(0,2).toUpperCase();
                img.onerror = function() {
                     this.onerror = null; 
                     this.src = `https://placehold.co/80x80/FFD166/333?text=${fallbackText}`;
                     this.classList.add('fruit-placeholder');
                };
                
                img.classList.add('fruit-item');
                // Geliş animasyonu için rastgele gecikme
                img.style.animationDelay = `${Math.random() * 0.3}s`;
                
                img.dataset.isTarget = fruitData.isTarget;
                img.dataset.type = fruitData.type;
                
                img.addEventListener('click', handleFruitClick);
                
                gameArea.appendChild(img);
            });
        }

        function handleFruitClick(e) {
            if (isInputLocked) return; // Zaten birine tıklandıysa bekle
            
            const clickedFruit = e.target;
            const isTarget = clickedFruit.dataset.isTarget === 'true';

            if (isTarget) {
                // DOĞRU CEVAP
                isInputLocked = true;
                score += 10;
                updateScoreDisplay();
                playCorrect(); // DOĞRU SESİ ÇAL
                
                // Hedef olan tüm meyveleri zıplat
                const allTargets = gameArea.querySelectorAll(`[data-is-target="true"]`);
                allTargets.forEach(el => {
                    el.classList.add('correct-choice');
                });

                // Kısa bir süre sonra yeni tur
                setTimeout(() => {
                    generateNewRound();
                }, 600); // Animasyon süresi kadar bekle

            } else {
                // YANLIŞ CEVAP
                isInputLocked = true; // Yeni tablo gelene kadar tıklamayı kilitle
                score = Math.max(0, score - 5); // Puan düş (0'ın altına inmesin)
                updateScoreDisplay();
                playWrong(); // YANLIŞ SESİ ÇAL
                
                clickedFruit.classList.add('wrong-choice');
                
                // Animasyon bitince hata tablosunu göster
                setTimeout(() => {
                    screenWrong.classList.remove('hidden');
                    
                    // 2 saniye sonra hata tablosunu kapat ve YENİ TABLO oluştur
                    setTimeout(() => {
                        screenWrong.classList.add('hidden');
                        generateNewRound(); // Farklı bir tablo (dizilim) gelsin
                    }, 2000);
                    
                }, 400); // Tıklanan meyvenin sallanma animasyonu süresi
            }
        }
    </script>
</body>
</html>
